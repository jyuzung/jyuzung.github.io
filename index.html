<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jyuzung · 博客</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
               全局重置 & 基础
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            line-height: 1.6;
            color: #1e293b;
            background: #b8c6d4;
            transition: background 1.2s ease;
            position: relative;
            overflow: hidden;
        }

        /* ============================================================
               天气背景层 (全屏 Canvas)
               ============================================================ */
        #weather-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ============================================================
               天气信息条 (右上) —— 默认隐藏，由 weather.js 显示
               ============================================================ */
        .weather-bar {
            display: none;
            position: fixed;
            top: 1.2rem;
            left: 1.5rem;
            z-index: 10;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 0.5rem 1.2rem 0.5rem 1.4rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            align-items: center;
            gap: 0.8rem;
            user-select: none;
        }
        .weather-bar.show { display: flex; }

        .weather-bar .city { font-weight: 600; color: #0f172a; }
        .weather-bar .temp { color: #2563eb; font-weight: 600; }
        .weather-bar .condition {
            color: #475569;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }
        .weather-bar .condition .emoji { font-size: 1.1rem; margin-right: 0.1rem; }
        .weather-bar .refresh-btn {
            background: rgba(37, 99, 235, 0.10);
            border: none;
            border-radius: 30px;
            padding: 0.2rem 0.7rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #2563eb;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .weather-bar .refresh-btn:hover {
            background: rgba(37, 99, 235, 0.20);
            transform: scale(1.02);
        }

        /* ============================================================
               城市切换控件 (左下) —— 也由天气模块控制显隐
               ============================================================ */
        .city-switcher {
            display: none;
            position: fixed;
            bottom: 1.8rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.50);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 60px;
            padding: 0.35rem 0.35rem 0.35rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            font-size: 0.8rem;
        }
        .city-switcher.show { display: flex; }

        .city-switcher input {
            border: none;
            background: transparent;
            padding: 0.3rem 0.2rem;
            font-size: 0.8rem;
            font-family: inherit;
            font-weight: 500;
            color: #0f172a;
            width: 90px;
            outline: none;
            border-bottom: 1.5px solid rgba(37, 99, 235, 0.20);
            transition: border-color 0.2s;
        }
        .city-switcher input:focus { border-bottom-color: #2563eb; }
        .city-switcher input::placeholder {
            color: #94a3b8;
            font-weight: 400;
            font-size: 0.75rem;
        }
        .city-switcher button {
            background: #2563eb;
            border: none;
            border-radius: 40px;
            padding: 0.3rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }
        .city-switcher button:hover { background: #1d4ed8; transform: scale(1.02); }
        .city-switcher button:active { transform: scale(0.97); }
        .city-switcher .hint {
            color: #94a3b8;
            font-size: 0.7rem;
            font-weight: 400;
            margin-left: 0.2rem;
            display: none;
        }
        @media (min-width: 600px) { .city-switcher .hint { display: inline; } }

        /* ============================================================
               主卡片 + 毛玻璃呼吸灯边框动画
               ============================================================ */
        .card {
            position: relative;
            z-index: 5;
            max-width: 780px;
            width: 100%;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 2.5rem;
            padding: 3rem 3rem 2.8rem;
            box-shadow:
                0 20px 60px -12px rgba(0, 20, 40, 0.22),
                0 8px 24px -8px rgba(0, 20, 40, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.25s ease;
            overflow: hidden;
			transform: translateX(6%);
        }

        /* 呼吸灯边框 */
        .card::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: inherit;
            padding: 3px;
            background: conic-gradient(
                from var(--angle, 0deg),
                #6366f1, #8b5cf6, #d946ef, #ec4899,
                #f43f5e, #f59e0b, #10b981, #3b82f6, #6366f1
            );
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: -1;
            animation: spin-glow 6s linear infinite;
        }

        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes spin-glow {
            to { --angle: 360deg; }
        }

        @supports not (background: conic-gradient(from var(--angle) at 50% 50%, red, blue)) {
            .card::before {
                animation: spin-glow-fallback 6s linear infinite;
                background: conic-gradient(#6366f1, #8b5cf6, #d946ef, #ec4899, #f43f5e, #f59e0b, #10b981, #3b82f6, #6366f1);
            }
            @keyframes spin-glow-fallback {
                to { transform: rotate(360deg); }
            }
        }

        @media (max-width: 520px) {
            .card {
                padding: 2rem 1.5rem 2rem;
                border-radius: 1.8rem;
            }
        }

        /* ── 头部 ── */
        .header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2.8rem;
            flex-wrap: wrap;
        }
        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: linear-gradient(135deg, #2d3b66, #1a2639);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.5px;
            box-shadow: 0 6px 16px -4px rgba(26, 38, 57, 0.30);
            flex-shrink: 0;
        }
        .title-group h1 {
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #1e293b, #3b4a62);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .title-group .sub {
            font-size: 0.9rem;
            font-weight: 400;
            color: #64748b;
            letter-spacing: 0.02em;
            margin-top: 0.05rem;
        }
        .title-group .sub span {
            display: inline-block;
            background: #e9edf4;
            padding: 0.1rem 0.7rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #334155;
            margin-left: 0.4rem;
            letter-spacing: 0;
        }

        /* ── 分割线 ── */
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, #e2e8f0 0%, #cbd5e1 50%, #e2e8f0 100%);
            margin: 0 0 2.2rem 0;
            opacity: 0.6;
        }

        /* ── 导航网格 ── */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        @media (max-width: 480px) {
            .nav-grid {
                grid-template-columns: 1fr;
                gap: 0.7rem;
            }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            background: #f1f4f9;
            border-radius: 1.4rem;
            padding: 1.2rem 1.2rem 1rem;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            cursor: default;
            text-decoration: none;
            color: inherit;
        }
        .nav-item:hover {
            background: #ffffff;
            border-color: #d0d9e8;
            box-shadow: 0 8px 20px -10px rgba(0, 20, 40, 0.12);
            transform: translateY(-2px);
        }

        .nav-item .label {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .nav-item .label .icon { font-size: 1.2rem; line-height: 1; }
        .nav-item .desc {
            font-size: 0.8rem;
            font-weight: 400;
            color: #64748b;
            margin-top: 0.2rem;
            letter-spacing: 0.01em;
        }
        .nav-item .badge {
            margin-top: 0.5rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #475569;
            background: #e2e8f0;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            align-self: flex-start;
            letter-spacing: 0.02em;
        }
        .project-list {
            margin-top: 0.35rem;
            padding-left: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .project-list li {
            list-style: none;
            font-size: 0.85rem;
            font-weight: 400;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .project-list li::before {
            content: "→";
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 300;
        }
        .project-list a {
            text-decoration: none;
            color: #2563eb;
            font-weight: 500;
            border-bottom: 1.5px solid transparent;
            transition: border-color 0.2s, color 0.2s;
            padding: 0.05rem 0;
        }
        .project-list a:hover {
            color: #1d4ed8;
            border-bottom-color: #93bbfc;
        }

        /* ============================================================
               留言板 (默认隐藏，由 guestbook.js 显示)
               ============================================================ */
        .guestbook-section {
            display: none;
            margin-top: 1.2rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(203, 213, 225, 0.5);
        }
        .guestbook-section.show { display: block; }

        .guestbook-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .guestbook-header .title {
            font-weight: 600;
            font-size: 1.05rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .guestbook-header .title .count {
            font-size: 0.75rem;
            font-weight: 400;
            color: #94a3b8;
            background: #e9edf4;
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
        }
        .guestbook-header .actions {
            display: flex;
            gap: 0.5rem;
        }
        .guestbook-header .actions button {
            background: #f1f4f9;
            border: none;
            border-radius: 30px;
            padding: 0.2rem 0.8rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .guestbook-header .actions button:hover {
            background: #e2e8f0;
            color: #0f172a;
        }
        .guestbook-header .actions .clear-btn {
            background: rgba(239, 68, 68, 0.10);
            color: #ef4444;
        }
        .guestbook-header .actions .clear-btn:hover {
            background: rgba(239, 68, 68, 0.20);
        }

        /* 留言列表 */
        .guestbook-list {
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            padding-right: 4px;
            margin-bottom: 1rem;
        }
        .guestbook-list::-webkit-scrollbar {
            width: 4px;
        }
        .guestbook-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 10px;
        }
        .guestbook-list::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .guestbook-item {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 1rem;
            padding: 0.8rem 1rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.2s;
        }
        .guestbook-item:hover {
            background: rgba(255, 255, 255, 0.75);
        }

        .guestbook-item .meta {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.3rem;
        }
        .guestbook-item .avatar-letter {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .guestbook-item .nickname {
            font-weight: 600;
            font-size: 0.85rem;
            color: #0f172a;
        }
        .guestbook-item .time {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-left: auto;
        }
        .guestbook-item .content {
            font-size: 0.9rem;
            color: #1e293b;
            padding-left: 2.4rem;
            word-break: break-word;
        }
        .guestbook-item .delete-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0 0.3rem;
            transition: color 0.2s;
            font-family: inherit;
            margin-left: 0.5rem;
        }
        .guestbook-item .delete-btn:hover {
            color: #ef4444;
        }

        /* 留言输入区 */
        .guestbook-form {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: flex-start;
            padding-top: 0.6rem;
            border-top: 1px solid rgba(203, 213, 225, 0.3);
        }
        .guestbook-form input,
        .guestbook-form textarea {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(203, 213, 225, 0.4);
            border-radius: 12px;
            padding: 0.5rem 0.8rem;
            font-size: 0.8rem;
            font-family: inherit;
            color: #0f172a;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .guestbook-form input:focus,
        .guestbook-form textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.10);
        }
        .guestbook-form input {
            flex: 1 1 120px;
            min-width: 80px;
        }
        .guestbook-form textarea {
            flex: 1 1 100%;
            min-height: 50px;
            resize: vertical;
        }
        .guestbook-form .submit-btn {
            background: #6366f1;
            border: none;
            border-radius: 30px;
            padding: 0.4rem 1.4rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            align-self: flex-end;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
        }
        .guestbook-form .submit-btn:hover {
            background: #4f46e5;
            transform: scale(1.02);
        }
        .guestbook-form .submit-btn:active {
            transform: scale(0.97);
        }

        .guestbook-empty {
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
            padding: 1.5rem 0;
        }

        /* ── 底部 ── */
        .footer-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.2rem;
            padding-top: 1.2rem;
            border-top: 1px solid #e9edf4;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .footer-meta .social {
            display: flex;
            gap: 1.2rem;
        }
        .footer-meta .social a {
            text-decoration: none;
            color: #64748b;
            font-weight: 450;
            transition: color 0.2s;
            font-size: 0.8rem;
            letter-spacing: 0.01em;
        }
        .footer-meta .social a:hover {
            color: #0f172a;
        }

        /* ── 响应式 ── */
        @media (max-width: 400px) {
            .avatar { width: 44px; height: 44px; font-size: 1.2rem; border-radius: 14px; }
            .title-group h1 { font-size: 1.5rem; }
            .weather-bar {
                top: 0.8rem; left: 0.8rem;
                padding: 0.35rem 0.9rem 0.35rem 1rem;
                font-size: 0.7rem;
                border-radius: 40px;
            }
            .city-switcher {
                bottom: 1rem;
                padding: 0.25rem 0.25rem 0.25rem 0.8rem;
            }
            .city-switcher input { width: 60px; font-size: 0.7rem; }
            .city-switcher button { font-size: 0.65rem; padding: 0.2rem 0.7rem; }
            .guestbook-item .content { padding-left: 0; }
            .guestbook-item .meta { flex-wrap: wrap; }
            .guestbook-item .time { margin-left: 0; width: 100%; padding-left: 2.4rem; }
        }

        /* ── 版本水印 ── */
        .version-tip {
            position: fixed;
            bottom: 0.8rem;
            right: 1.5rem;
            z-index: 1;
            font-size: 0.6rem;
            color: rgba(148, 163, 184, 0.30);
            letter-spacing: 0.06em;
            pointer-events: none;
            user-select: none;
        }

        /* ============================================================
               浮动画板（右下斜靠）—— 默认隐藏，由 pixel.js 显示
               ============================================================ */
        .float-pixel-wrapper {
            display: none;
            position: fixed;
            bottom: 80px;
            right: 30px;
            z-index: 20;
            width: 160px;
            height: 160px;
            perspective: 800px;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                        width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                        height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                        bottom 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                        right 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: rotate(-6deg) translateY(0);
            transform-origin: bottom right;
        }
        .float-pixel-wrapper.show { display: block; }

        .float-pixel-inner {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15), 0 4px 12px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            padding: 8px;
            transition: background 0.4s, box-shadow 0.4s;
            overflow: hidden;
        }

        .float-pixel-hint {
            position: absolute;
            bottom: 6px;
            right: 12px;
            font-size: 0.6rem;
            color: rgba(100, 116, 139, 0.6);
            letter-spacing: 0.04em;
            pointer-events: none;
            user-select: none;
            writing-mode: vertical-rl;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .pixel-tools-float {
            display: none;
            align-items: center;
            gap: 0.5rem;
            padding: 4px 8px 4px 12px;
            background: rgba(255, 255, 255, 0.50);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 30px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .pixel-tools-float input[type="color"] {
            width: 28px;
            height: 28px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        .pixel-tools-float button {
            background: #f1f4f9;
            border: none;
            border-radius: 30px;
            padding: 0.15rem 0.7rem;
            font-size: 0.65rem;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
        .pixel-tools-float button:hover {
            background: #e2e8f0;
        }
        .pixel-tools-float .active-tool {
            background: #2563eb;
            color: #fff;
        }
        .pixel-tools-float .active-tool:hover {
            background: #1d4ed8;
        }
        .pixel-tools-float .close-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            font-size: 0.7rem;
            padding: 0.15rem 0.6rem;
        }
        .pixel-tools-float .close-btn:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        #floatPixelCanvas {
            width: 100%;
            height: 100%;
            flex: 1;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            image-rendering: pixelated;
            display: block;
            cursor: crosshair;
            min-height: 0;
        }

        /* 展开状态 */
        .float-pixel-wrapper.expanded {
            width: 90vw;
            height: 82vh;
            max-width: 800px;
            max-height: 700px;
            bottom: 50%;
            right: 50%;
            transform: translate(50%, 50%) rotate(0deg) scale(1);
            cursor: default;
            z-index: 100;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                        width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                        height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                        bottom 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                        right 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .float-pixel-wrapper.expanded .float-pixel-inner {
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.30);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .float-pixel-wrapper.expanded .pixel-tools-float {
            display: flex;
        }

        .float-pixel-wrapper.expanded .float-pixel-hint {
            opacity: 0;
        }

        /* 遮罩（仅背景暗化） */
        .pixel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 90;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .pixel-overlay.active {
            opacity: 1;
            pointer-events: none;
        }

		/* ============================================================
		   移动端适配（≤600px）—— 确保所有元素可见且不遮挡
		   ============================================================ */
		@media (max-width: 600px) {
			body {
				padding: 0.5rem 0.5rem 5rem; /* 底部留出空间给悬浮元素 */
			}

			/* 主卡片：上下留边距，避开悬浮元素 */
			.card {
				margin: 3.2rem auto 8rem;   /* 顶部避开天气条，底部避开宠物+留言预览 */
				padding: 1.2rem 1rem 1.2rem;
				border-radius: 1.8rem;
				transform: translateX(0);    /* 取消偏移，居中 */
				max-width: 96vw;
				width: 100%;
			}

			/* 天气条：左上角，小尺寸 */
			.weather-bar {
				top: 0.6rem;
				left: 0.6rem;
				padding: 0.25rem 0.8rem 0.25rem 1rem;

				background: rgba(255,255,255,0.7);

			.weather-bar .temp { font-size: 0.7rem; }
			.weather-bar .condition { font-size: 0.7rem; }
			.weather-bar .refresh-btn {
				padding: 0.1rem 0.5rem;
				font-size: 0.6rem;
			}

			/* 城市切换：底部居中，避开其他元素 */
			.city-switcher {
				bottom: 4.2rem;   /* 在宠物和留言预览之上 */
				left: 50%;
				transform: translateX(-50%);
				padding: 0.2rem 0.2rem 0.2rem 0.8rem;
				font-size: 0.7rem;
				z-index: 15;
				background: rgba(255,255,255,0.7);
			}
			.city-switcher input { width: 60px; font-size: 0.7rem; }
			.city-switcher button { font-size: 0.6rem; padding: 0.15rem 0.6rem; }
			.city-switcher .hint { display: none; }

			/* 留言板预览（左下角）—— 移到最底部，不遮挡卡片 */
			.gb-preview {
				position: fixed;
				bottom: 0.8rem !important;
				left: 0.8rem !important;
				right: auto !important;
				width: auto !important;
				max-width: 60vw !important;
				min-width: 140px !important;
				padding: 6px 10px !important;
				background: rgba(255,255,255,0.92) !important;
				backdrop-filter: blur(10px) !important;
				-webkit-backdrop-filter: blur(10px) !important;
				border-radius: 14px !important;
				border: 1px solid rgba(139,92,246,0.15) !important;
				box-shadow: 0 4px 16px rgba(0,0,0,0.08) !important;
				z-index: 20 !important;
				cursor: pointer;
				transition: all 0.3s;
			}
			.gb-preview .preview-header {
				font-size: 0.75rem !important;
				margin-bottom: 2px !important;
				color: #4c1d95;
			}
			.gb-preview .preview-header .badge {
				font-size: 0.6rem !important;
			}
			.gb-preview .preview-item {
				font-size: 0.7rem !important;
				padding: 2px 4px !important;
				gap: 4px !important;
				background: transparent !important;
				border: none !important;
			}
			.gb-preview .preview-item .pv-nick {
				max-width: 36px !important;
				font-size: 0.65rem !important;
				color: #7c3aed;
			}
			.gb-preview .preview-item .pv-text {
				font-size: 0.65rem !important;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
				max-width: 80px;
			}
			.gb-preview .preview-footer {
				font-size: 0.6rem !important;
				margin-top: 2px !important;
				padding-top: 2px !important;
				border-top: 1px solid rgba(139,92,246,0.1);
				color: #7c3aed;
			}
			.gb-preview .preview-empty {
				font-size: 0.65rem !important;
				padding: 2px 0 !important;
			}

			/* 宠物（右下角）—— 确保可见，尺寸适中 */
			.pet-container {
				position: fixed !important;
				bottom: 0.8rem !important;
				right: 0.8rem !important;
				z-index: 25 !important;
				transform: scale(0.75) !important;
				transform-origin: bottom right !important;
				filter: drop-shadow(0 2px 8px rgba(0,0,0,0.08)) !important;
				cursor: pointer;
			}
			.pet-container canvas {
				width: 88px !important;
				height: 88px !important;
				display: block;
			}
			.pet-container:hover {
				transform: scale(0.8) !important;
			}
			.pet-bubble {
				font-size: 0.7rem !important;
				padding: 4px 10px !important;
				max-width: 140px !important;
				white-space: normal !important;
				bottom: 105% !important;
				left: 50% !important;
				transform: translateX(-50%) !important;
				background: rgba(255,255,255,0.95) !important;
			}
			.pet-bubble.show {
				transform: translateX(-50%) translateY(0) scale(1) !important;
			}

			/* 浮动画板（右下角）—— 避免与宠物重叠，左移 */
			.float-pixel-wrapper {
				bottom: 5.5rem !important;
				right: 5.5rem !important;
				width: 100px !important;
				height: 100px !important;
				transform: rotate(-6deg) scale(0.8) !important;
				transform-origin: bottom right !important;
				z-index: 20 !important;
			}
			.float-pixel-wrapper.expanded {
				width: 92vw !important;
				height: 70vh !important;
				max-width: none !important;
				max-height: none !important;
				bottom: 50% !important;
				right: 50% !important;
				transform: translate(50%, 50%) rotate(0deg) scale(1) !important;
			}
			.float-pixel-wrapper .pixel-tools-float button {
				font-size: 0.5rem !important;
				padding: 0.05rem 0.4rem !important;
			}

			/* 侧边栏留言板（全屏） */
			.gb-sidebar {
				width: 90vw !important;
				max-width: 90vw !important;
				padding: 1rem 0.8rem !important;
				z-index: 50 !important;
			}
			.gb-item .content {
				padding-left: 0 !important;
			}
			.gb-item .meta {
				flex-wrap: wrap !important;
			}
			.gb-item .time {
				margin-left: 0 !important;

				padding-left: 2rem !important;
			}

				font-size: 0.7rem !important;
			}
			.gb-sidebar .gb-form .submit-btn {
				font-size: 0.7rem !important;
				padding: 0.2rem 0.8rem !important;
			}

			/* 底部信息 */
			.footer-meta {
				font-size: 0.65rem !important;
				flex-wrap: wrap;
				gap: 0.5rem;
				margin-top: 0.8rem;
				padding-top: 0.8rem;
			}
			.footer-meta .social {
				gap: 0.8rem;
			}
			.footer-meta .social a {
				font-size: 0.65rem !important;
			}

			/* 导航网格单列 */
			.nav-grid {
				grid-template-columns: 1fr !important;
				gap: 0.7rem !important;
			}

			/* 头像标题缩小 */
			.avatar {
				width: 44px !important;
				height: 44px !important;
				font-size: 1.2rem !important;
				border-radius: 14px !important;
			}
			.title-group h1 {
				font-size: 1.5rem !important;
			}
			.title-group .sub {
				font-size: 0.75rem !important;
			}

			/* 版本水印 */
			.version-tip {
				bottom: 0.3rem !important;
				right: 0.5rem !important;
				font-size: 0.5rem !important;
				z-index: 5 !important;
			}

			/* 遮罩层 */
			.pixel-overlay.active {
				opacity: 1 !important;
			}
		}

		/* ============================================================
		   小屏手机（≤400px）微调
		   ============================================================ */
		@media (max-width: 400px) {
			.card {
				margin: 2.8rem auto 7rem;
				padding: 1rem 0.8rem;
			}
			.weather-bar {
				top: 0.4rem;
				left: 0.4rem;
				padding: 0.2rem 0.6rem 0.2rem 0.8rem;
				font-size: 0.6rem;
			}
			.weather-bar .city,
			.weather-bar .temp,
			.weather-bar .condition {
				font-size: 0.6rem;
			}

				padding: 0.05rem 0.4rem;

			}

				transform: scale(0.65) !important;
			}

				height: 72px !important;
			}

				font-size: 0.65rem !important;
			}
			.gb-preview .preview-item {
				font-size: 0.6rem !important;
				padding: 1px 3px !important;
			}
			.gb-preview .preview-item .pv-nick {
				max-width: 28px !important;
				font-size: 0.55rem !important;
			}
			.gb-preview .preview-item .pv-text {
				font-size: 0.55rem !important;
				max-width: 60px;
			}
			.gb-preview .preview-footer {
				font-size: 0.5rem !important;
			}
			.float-pixel-wrapper {
				width: 80px !important;
				height: 80px !important;
				bottom: 4.5rem !important;
				right: 4rem !important;
				transform: rotate(-6deg) scale(0.7) !important;
