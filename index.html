<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>天气博客 · 动态背景</title>

    <!-- 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
               1. 全局重置 & 基础
               ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            line-height: 1.6;
            color: #1e293b;
            /* 背景由 JS 动态控制，此处仅做 fallback */
            background: #b8c6d4;
            transition: background 1.2s ease;
            position: relative;
            overflow: hidden;
        }

        /* ============================================================
               2. 天气背景层 (全屏 Canvas)
               ============================================================ */
        #weather-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            /* 允许点击穿透，让卡片可交互 */;
        }

        /* ============================================================
               3. 天气信息条 (浮动在右上角，轻量)
               ============================================================ */
        .weather-bar {
            position: fixed;
            top: 1.2rem;
            right: 1.5rem;
            z-index: 10;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 60px;
            padding: 0.5rem 1.2rem 0.5rem 1.4rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            letter-spacing: 0.01em;
            transition: all 0.3s;
            user-select: none;
        }
        .weather-bar .city {
            font-weight: 600;
            color: #0f172a;
        }
        .weather-bar .temp {
            color: #2563eb;
            font-weight: 600;
        }
        .weather-bar .condition {
            color: #475569;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }
        .weather-bar .condition .emoji {
            font-size: 1.1rem;
            margin-right: 0.1rem;
        }
        .weather-bar .refresh-btn {
            background: rgba(37, 99, 235, 0.10);
            border: none;
            border-radius: 30px;
            padding: 0.2rem 0.7rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #2563eb;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            letter-spacing: 0.02em;
        }
        .weather-bar .refresh-btn:hover {
            background: rgba(37, 99, 235, 0.20);
            transform: scale(1.02);
        }

        /* ============================================================
               4. 城市切换控件 (左下角，轻量)
               ============================================================ */
        .city-switcher {
            position: fixed;
            bottom: 1.8rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.50);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 60px;
            padding: 0.35rem 0.35rem 0.35rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        .city-switcher input {
            border: none;
            background: transparent;
            padding: 0.3rem 0.2rem;
            font-size: 0.8rem;
            font-family: inherit;
            font-weight: 500;
            color: #0f172a;
            width: 90px;
            outline: none;
            border-bottom: 1.5px solid rgba(37, 99, 235, 0.20);
            transition: border-color 0.2s;
        }
        .city-switcher input:focus {
            border-bottom-color: #2563eb;
        }
        .city-switcher input::placeholder {
            color: #94a3b8;
            font-weight: 400;
            font-size: 0.75rem;
        }
        .city-switcher button {
            background: #2563eb;
            border: none;
            border-radius: 40px;
            padding: 0.3rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            letter-spacing: 0.02em;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }
        .city-switcher button:hover {
            background: #1d4ed8;
            transform: scale(1.02);
        }
        .city-switcher button:active {
            transform: scale(0.97);
        }
        .city-switcher .hint {
            color: #94a3b8;
            font-size: 0.7rem;
            font-weight: 400;
            margin-left: 0.2rem;
            display: none;
        }
        @media (min-width: 600px) {
            .city-switcher .hint {
                display: inline;
            }
        }

        /* ============================================================
               5. 主卡片 (毛玻璃，置顶)
               ============================================================ */
        .card {
            position: relative;
            z-index: 5;
            max-width: 780px;
            width: 100%;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 2.5rem;
            padding: 3rem 3rem 2.8rem;
            box-shadow:
                0 20px 60px -12px rgba(0, 20, 40, 0.22),
                0 8px 24px -8px rgba(0, 20, 40, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.25s ease;
        }
        @media (max-width: 520px) {
            .card {
                padding: 2rem 1.5rem 2rem;
                border-radius: 1.8rem;
            }
        }

        /* ── 头部 ── */
        .header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2.8rem;
            flex-wrap: wrap;
        }
        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: linear-gradient(135deg, #2d3b66, #1a2639);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 600;
            color: #fff;
            letter-spacing: -0.5px;
            box-shadow: 0 6px 16px -4px rgba(26, 38, 57, 0.30);
            flex-shrink: 0;
        }
        .title-group h1 {
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #1e293b, #3b4a62);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .title-group .sub {
            font-size: 0.9rem;
            font-weight: 400;
            color: #64748b;
            letter-spacing: 0.02em;
            margin-top: 0.05rem;
        }
        .title-group .sub span {
            display: inline-block;
            background: #e9edf4;
            padding: 0.1rem 0.7rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
            color: #334155;
            margin-left: 0.4rem;
            letter-spacing: 0;
        }

        /* ── 分割线 ── */
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, #e2e8f0 0%, #cbd5e1 50%, #e2e8f0 100%);
            margin: 0 0 2.2rem 0;
            opacity: 0.6;
        }

        /* ── 导航网格 ── */
        .nav-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2.6rem;
        }
        @media (max-width: 480px) {
            .nav-grid {
                grid-template-columns: 1fr;
                gap: 0.7rem;
            }
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            background: #f1f4f9;
            border-radius: 1.4rem;
            padding: 1.2rem 1.2rem 1rem;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            cursor: default;
            text-decoration: none;
            color: inherit;
        }
        .nav-item:hover {
            background: #ffffff;
            border-color: #d0d9e8;
            box-shadow: 0 8px 20px -10px rgba(0, 20, 40, 0.12);
            transform: translateY(-2px);
        }
        .nav-item .label {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .nav-item .label .icon {
            font-size: 1.2rem;
            line-height: 1;
        }
        .nav-item .desc {
            font-size: 0.8rem;
            font-weight: 400;
            color: #64748b;
            margin-top: 0.2rem;
            letter-spacing: 0.01em;
        }
        .nav-item .badge {
            margin-top: 0.5rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #475569;
            background: #e2e8f0;
            padding: 0.15rem 0.6rem;
            border-radius: 30px;
            align-self: flex-start;
            letter-spacing: 0.02em;
        }
        .project-list {
            margin-top: 0.35rem;
            padding-left: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .project-list li {
            list-style: none;
            font-size: 0.85rem;
            font-weight: 400;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .project-list li::before {
            content: "→";
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 300;
        }
        .project-list a {
            text-decoration: none;
            color: #2563eb;
            font-weight: 500;
            border-bottom: 1.5px solid transparent;
            transition: border-color 0.2s, color 0.2s;
            padding: 0.05rem 0;
        }
        .project-list a:hover {
            color: #1d4ed8;
            border-bottom-color: #93bbfc;
        }

        .nav-item.disabled {
            cursor: default;
            opacity: 0.75;
        }
        .nav-item.disabled:hover {
            transform: none;
            background: #f1f4f9;
            border-color: transparent;
            box-shadow: none;
        }

        /* ── 底部 ── */
        .footer-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 0.6rem;
            padding-top: 1.2rem;
            border-top: 1px solid #e9edf4;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .footer-meta .social {
            display: flex;
            gap: 1.2rem;
        }
        .footer-meta .social a {
            text-decoration: none;
            color: #64748b;
            font-weight: 450;
            transition: color 0.2s;
            font-size: 0.8rem;
            letter-spacing: 0.01em;
        }
        .footer-meta .social a:hover {
            color: #0f172a;
        }

        /* ── 响应式微调 ── */
        @media (max-width: 400px) {
            .avatar {
                width: 44px;
                height: 44px;
                font-size: 1.2rem;
                border-radius: 14px;
            }
            .title-group h1 {
                font-size: 1.5rem;
            }
            .weather-bar {
                top: 0.8rem;
                right: 0.8rem;
                padding: 0.35rem 0.9rem 0.35rem 1rem;
                font-size: 0.7rem;
                border-radius: 40px;
            }
            .city-switcher {
                bottom: 1rem;
                padding: 0.25rem 0.25rem 0.25rem 0.8rem;
            }
            .city-switcher input {
                width: 60px;
                font-size: 0.7rem;
            }
            .city-switcher button {
                font-size: 0.65rem;
                padding: 0.2rem 0.7rem;
            }
        }

        /* ── 加载状态 ── */
        .loading-dot {
            display: inline-block;
            animation: pulse 1.2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        /* ── 右下角版本信息 (极淡) ── */
        .version-tip {
            position: fixed;
            bottom: 0.8rem;
            right: 1.5rem;
            z-index: 1;
            font-size: 0.6rem;
            color: rgba(148, 163, 184, 0.30);
            letter-spacing: 0.06em;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- ============================================================
    Canvas 背景层
    ============================================================ -->
    <canvas id="weather-canvas"></canvas>

    <!-- ============================================================
    天气信息条 (右上)
    ============================================================ -->
    <div class="weather-bar" id="weatherBar">
        <span class="city" id="cityDisplay">🌍 广州</span>
        <span class="temp" id="tempDisplay">--°C</span>
        <span class="condition" id="conditionDisplay">
            <span class="emoji">☀️</span>
            <span>加载中</span>
        </span>
        <button class="refresh-btn" id="refreshBtn">↻</button>
    </div>

    <!-- ============================================================
    城市切换 (底部居中)
    ============================================================ -->
    <div class="city-switcher" id="citySwitcher">
        <input type="text" id="cityInput" placeholder="城市名称" value="广州" />
        <button id="switchBtn">切换</button>
        <span class="hint">· 回车确认</span>
    </div>

    <!-- ============================================================
    版本水印
    ============================================================ -->
    <div class="version-tip">✦ 天气动态 v2.0</div>

    <!-- ============================================================
    主卡片 (博客内容)
    ============================================================ -->
    <div class="card">

        <!-- 头部 -->
        <header class="header">
            <div class="avatar">JZ</div>
            <div class="title-group">
                <h1>JyuZung</h1>
                <div class="sub">
                    ✦ 个人博客
                    <span>v1.0</span>
                </div>
            </div>
        </header>

        <div class="divider"></div>

        <!-- 导航网格 -->
        <div class="nav-grid">
            <!-- 1. 项目 -->
            <div class="nav-item">
                <div class="label">
                    <span class="icon">📁</span> 项目
                </div>
                <div class="desc">前端设计</div>
                <ul class="project-list">
                    <li><a href="./project/zishiyin/index.html">网页设计</a></li>
                </ul>
                <ul class="project-list">
                    <li><a href="./project/blog/index.html">托管博客</a></li>
                </ul>
                <span class="badge">2 个作品</span>
            </div>

            <!-- 2. 笔记 -->
            <div class="nav-item disabled">
                <div class="label">
                    <span class="icon">📝</span> 笔记
                </div>
                <div class="desc">思考 · 记录 · 沉淀</div>
                <ul class="project-list">
                    <li><a href="https://blog.csdn.net/codjjfb/article/details/117339610">手写BP神经网络</a></li>
                </ul>
                <span class="badge">1 个作品</span>
            </div>

            <!-- 3. 读书 -->
            <div class="nav-item disabled">
                <div class="label">
                    <span class="icon">📚</span> 读书
                </div>
                <div class="desc">书摘 · 感悟 · 推荐</div>
                <span class="badge">即将上线</span>
            </div>
        </div>

        <!-- 底部 -->
        <div class="footer-meta">
            <span>© 2026 JyuZung</span>
            <div class="social">
                <a href="#">GitHub</a>
                <a href="#">RSS</a>
                <a href="#">关于</a>
            </div>
        </div>

    </div>

    <!-- ============================================================
    JavaScript — 天气 + 粒子系统
    ============================================================ -->
    <script>
        /* =============================================================
               🌤  配置区 — 你可在此修改默认城市、粒子数量等
               ============================================================= */
        const CONFIG = {
            defaultCity: '广州', // 默认城市
            particleCount: {
                sunny: 70,
                cloudy: 40,
                rainy: 160,
                snowy: 130,
                foggy: 50,
                thunder: 110,
                default: 60,
            },
            refreshInterval: 10 * 60 * 1000, // 自动刷新间隔 (10分钟)
        };

        /* =============================================================
               1. 工具函数
               ============================================================= */
        function lerp(a, b, t) { return a + (b - a) * t; }

        function rand(min, max) { return Math.random() * (max - min) + min; }

        function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

        /* =============================================================
               2. 天气状态映射
               ============================================================= */
        const WEATHER_MAP = {
            // 晴天
            sunny: {
                keywords: ['sunny', 'clear', 'fair', 'hot'],
                emoji: '☀️',
                label: '晴天',
                bg: ['#f9e5b3', '#f6d5a8', '#f0c8a0'],
                particle: {
                    color: ['#fde68a', '#fcd34d', '#ffffff', '#fbbf24'],
                    size: [3, 12],
                    speed: [0.2, 0.5],
                    count: CONFIG.particleCount.sunny,
                    type: 'float', // 漂浮
                    glow: true,
                },
                bodyBg: 'linear-gradient(145deg, #f9e5b3 0%, #f6d5a8 40%, #f0c8a0 100%)',
            },
            // 多云
            cloudy: {
                keywords: ['cloudy', 'overcast', 'partly cloudy', 'mostly cloudy'],
                emoji: '☁️',
                label: '多云',
                bg: ['#d5d8df', '#c8ccd8', '#b8c0cb'],
                particle: {
                    color: ['#e8ecf1', '#d5d8df', '#c8ccd8', '#f0f2f5'],
                    size: [15, 40],
                    speed: [0.15, 0.35],
                    count: CONFIG.particleCount.cloudy,
                    type: 'drift', // 水平飘动
                    glow: false,
                },
                bodyBg: 'linear-gradient(145deg, #d5d8df 0%, #c8ccd8 50%, #b8c0cb 100%)',
            },
            // 雨天
            rainy: {
                keywords: ['rain', 'drizzle', 'shower', 'light rain', 'moderate rain', 'heavy rain', 'rainy'],
                emoji: '🌧️',
                label: '雨天',
                bg: ['#2c3e50', '#3a5a6f', '#4a6a7f'],
                particle: {
                    color: ['#8bb8d4', '#a8d0e6', '#c8e4f0', '#7aa9c4'],
                    size: [1.5, 4],
                    speed: [6, 12],
                    count: CONFIG.particleCount.rainy,
                    type: 'fall', // 下落
                    glow: false,
                    tilt: true, // 倾斜
                },
                bodyBg: 'linear-gradient(145deg, #2c3e50 0%, #3a5a6f 40%, #4a6a7f 100%)',
            },
            // 雪天
            snowy: {
                keywords: ['snow', 'sleet', 'blizzard', 'snowy', 'light snow', 'heavy snow'],
                emoji: '❄️',
                label: '雪天',
                bg: ['#e8ecf1', '#d5dce6', '#c0cbd8'],
                particle: {
                    color: ['#ffffff', '#f0f4f8', '#e8ecf1', '#fafcff'],
                    size: [3, 10],
                    speed: [0.8, 2.0],
                    count: CONFIG.particleCount.snowy,
                    type: 'snow', // 飘落 + 旋转
                    glow: false,
                    spin: true,
                },
                bodyBg: 'linear-gradient(145deg, #e8ecf1 0%, #d5dce6 50%, #c0cbd8 100%)',
            },
            // 雾天
            foggy: {
                keywords: ['mist', 'fog', 'haze', 'foggy'],
                emoji: '🌫️',
                label: '雾天',
                bg: ['#d5d8df', '#c8ccd5', '#e0e4eb'],
                particle: {
                    color: ['#f0f2f5', '#e8ecf1', '#ffffff', '#d5d8df'],
                    size: [30, 60],
                    speed: [0.1, 0.25],
                    count: CONFIG.particleCount.foggy,
                    type: 'drift',
                    glow: true,
                    opacity: 0.25,
                },
                bodyBg: 'linear-gradient(145deg, #d5d8df 0%, #c8ccd5 40%, #e0e4eb 100%)',
            },
            // 雷雨
            thunder: {
                keywords: ['thunder', 'thunderstorm', 'lightning', 'storm'],
                emoji: '⛈️',
                label: '雷雨',
                bg: ['#1a1a2e', '#16213e', '#0f3460'],
                particle: {
                    color: ['#6b9fc4', '#8bb8d4', '#a8d0e6', '#4a8aaf'],
                    size: [1.5, 4.5],
                    speed: [7, 14],
                    count: CONFIG.particleCount.thunder,
                    type: 'fall',
                    glow: false,
                    tilt: true,
                    lightning: true, // 启用闪电
                },
                bodyBg: 'linear-gradient(145deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%)',
            },
        };

        // 关键词 → 天气类型 的查找映射
        function matchWeatherType(conditionText) {
            const text = conditionText.toLowerCase();
            for (const [type, data] of Object.entries(WEATHER_MAP)) {
                for (const kw of data.keywords) {
                    if (text.includes(kw)) return type;
                }
            }
            return 'sunny'; // fallback
        }

        /* =============================================================
               3. 粒子系统 (Canvas)
               ============================================================= */
        class Particle {
            constructor(canvasWidth, canvasHeight, config) {
                this.w = canvasWidth;
                this.h = canvasHeight;
                this.reset(config);
            }

            reset(config) {
                const { color, size, speed, type, glow, tilt, spin, opacity } = config;
                this.type = type || 'float';
                this.glow = glow || false;
                this.tilt = tilt || false;
                this.spin = spin || false;

                // 颜色
                this.color = color[randInt(0, color.length - 1)];
                // 大小
                this.size = rand(size[0], size[1]);
                // 透明度
                this.opacity = opacity !== undefined ? rand(opacity * 0.6, opacity) : rand(0.5, 1.0);

                // 位置
                this.x = rand(0, this.w);
                this.y = rand(0, this.h);

                // 速度
                const spd = rand(speed[0], speed[1]);
                if (type === 'fall' || type === 'snow') {
                    this.vx = tilt ? rand(-0.6, 0.6) : rand(-0.2, 0.2);
                    this.vy = spd * (type === 'snow' ? rand(0.3, 1.0) : 1.0);
                } else if (type === 'drift') {
                    this.vx = rand(-spd, spd);
                    this.vy = rand(-spd * 0.3, spd * 0.3);
                } else { // float
                    this.vx = rand(-spd, spd);
                    this.vy = rand(-spd, spd);
                }

                // 旋转 (雪天)
                this.rotation = rand(0, Math.PI * 2);
                this.rotationSpeed = spin ? rand(-0.02, 0.02) : 0;

                // 生命周期 (用于渐入)
                this.life = 0;
                this.maxLife = rand(40, 120);
                this.fading = false;

                // 闪烁 (晴天)
                this.twinkle = glow ? rand(0, 1) : 0;
                this.twinkleSpeed = glow ? rand(0.01, 0.03) : 0;
            }

            update(w, h) {
                this.w = w;
                this.h = h;

                // 位置更新
                this.x += this.vx;
                this.y += this.vy;

                // 边界循环
                if (this.type === 'fall' || this.type === 'snow') {
                    if (this.y > this.h + 20) {
                        this.y = -20;
                        this.x = rand(0, this.w);
                        this.vy = rand(0.3, 1.0) * (this.type === 'snow' ? 1.5 : 4);
                    }
                    if (this.x < -20) this.x = this.w + 20;
                    if (this.x > this.w + 20) this.x = -20;
                } else {
                    if (this.x < -50) this.x = this.w + 50;
                    if (this.x > this.w + 50) this.x = -50;
                    if (this.y < -50) this.y = this.h + 50;
                    if (this.y > this.h + 50) this.y = -50;
                }

                // 旋转
                if (this.spin) {
                    this.rotation += this.rotationSpeed;
                }

                // 闪烁
                if (this.twinkle) {
                    this.twinkle += this.twinkleSpeed;
                    if (this.twinkle > 1 || this.twinkle < 0) this.twinkleSpeed *= -1;
                }

                // 生命周期 (渐入)
                if (this.life < this.maxLife) {
                    this.life++;
                }
            }

            draw(ctx) {
                const alpha = Math.min(1, this.life / this.maxLife) * this.opacity;
                const twinkleFactor = this.twinkle ? 0.5 + 0.5 * Math.sin(this.twinkle * Math.PI * 2) : 1;

                ctx.save();
                ctx.globalAlpha = alpha * twinkleFactor;

                if (this.glow) {
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 20;
                }

                ctx.translate(this.x, this.y);

                if (this.spin) {
                    ctx.rotate(this.rotation);
                }

                if (this.type === 'fall' && this.tilt) {
                    // 雨滴 — 倾斜的线条
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = this.size * 0.5;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(-4, -6);
                    ctx.lineTo(4, 6);
                    ctx.stroke();
                } else if (this.type === 'snow') {
                    // 雪花 — 六角星或圆形
                    const r = this.size * 0.6;
                    ctx.fillStyle = this.color;
                    if (this.size > 6) {
                        // 简单的六角星
                        ctx.beginPath();
                        for (let i = 0; i < 6; i++) {
                            const angle = (i / 6) * Math.PI * 2 - Math.PI / 2;
                            const outer = r;
                            const inner = r * 0.4;
                            const rad = i % 2 === 0 ? outer : inner;
                            if (i === 0) ctx.moveTo(rad * Math.cos(angle), rad * Math.sin(angle));
                            else ctx.lineTo(rad * Math.cos(angle), rad * Math.sin(angle));
                        }
                        ctx.closePath();
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.arc(0, 0, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (this.type === 'drift' && this.size > 20) {
                    // 云朵 — 多个圆形叠加
                    const r = this.size * 0.5;
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = alpha * twinkleFactor * 0.7;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.arc(-r * 0.7, -r * 0.3, r * 0.7, 0, Math.PI * 2);
                    ctx.arc(r * 0.7, -r * 0.3, r * 0.7, 0, Math.PI * 2);
                    ctx.arc(-r * 0.3, r * 0.3, r * 0.6, 0, Math.PI * 2);
                    ctx.arc(r * 0.3, r * 0.3, r * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // 默认圆形
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        /* =============================================================
               4. 主控制器
               ============================================================= */
        class WeatherBackground {
            constructor() {
                this.canvas = document.getElementById('weather-canvas');
                this.ctx = this.canvas.getContext('2d');

                this.particles = [];
                this.currentWeather = 'sunny';
                this.isRaining = false;
                this.lightningFlash = 0;
                this.lightningTimer = 0;

                this.city = CONFIG.defaultCity;
                this.temperature = '--';
                this.conditionText = '加载中';
                this.conditionEmoji = '☀️';

                this.isLoading = false;
                this.animationId = null;

                // DOM 引用
                this.cityDisplay = document.getElementById('cityDisplay');
                this.tempDisplay = document.getElementById('tempDisplay');
                this.conditionDisplay = document.getElementById('conditionDisplay');

                this.resize();
                window.addEventListener('resize', () => this.resize());

                // 绑定事件
                document.getElementById('refreshBtn').addEventListener('click', () => this.fetchWeather());
                document.getElementById('switchBtn').addEventListener('click', () => this.switchCity());
                document.getElementById('cityInput').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.switchCity();
                });

                // 启动
                this.fetchWeather();

                // 定时刷新
                setInterval(() => this.fetchWeather(), CONFIG.refreshInterval);
            }

            resize() {
                const rect = this.canvas.getBoundingClientRect();
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.width = this.canvas.width;
                this.height = this.canvas.height;
                // 粒子位置自适应
                for (const p of this.particles) {
                    p.w = this.width;
                    p.h = this.height;
                }
            }

            /* ── 天气获取 ── */
            async fetchWeather()  {
				if (this.isLoading) return;
				this.isLoading = true;

				const city = encodeURIComponent(this.city);
				const url = `https://wttr.in/${city}?format=%C|%t|%l&lang=zh`;

				try {
					const resp = await fetch(url, {
						signal: AbortSignal.timeout(8000),
						headers: { 'Accept': 'text/plain' }  // 强制纯文本
					});
					const text = await resp.text();

					// 若返回 HTML（包含 <），尝试提取纯文本或使用默认值
					let cleanText = text;
					if (text.includes('<') || text.includes('>')) {
						// 用 DOMParser 提取纯文本
						const parser = new DOMParser();
						const doc = parser.parseFromString(text, 'text/html');
						cleanText = doc.body.textContent || '晴';
					}

					const parts = cleanText.split('|').map(s => s.trim());
					const conditionRaw = parts[0] || '晴';
					const tempRaw = parts[1] || '--°C';
					const locationRaw = parts[2] || this.city;

					// 解析温度
					const tempMatch = tempRaw.match(/([+-]?\d+)°C/);
					this.temperature = tempMatch ? tempMatch[1] + '°C' : tempRaw;

					// 匹配天气类型
					const weatherType = matchWeatherType(conditionRaw);
					this.currentWeather = weatherType;
					this.conditionText = conditionRaw;

					const weatherData = WEATHER_MAP[weatherType];
					this.conditionEmoji = weatherData.emoji;

					// ---------- 安全更新 DOM ----------
					this.cityDisplay.textContent = `📍 ${locationRaw}`;
					this.tempDisplay.textContent = this.temperature;

					// 清空并重新构建 conditionDisplay（避免 innerHTML 注入）
					this.conditionDisplay.innerHTML = '';
					const emojiSpan = document.createElement('span');
					emojiSpan.className = 'emoji';
					emojiSpan.textContent = weatherData.emoji;
					const textSpan = document.createElement('span');
					textSpan.textContent = conditionRaw;
					this.conditionDisplay.appendChild(emojiSpan);
					this.conditionDisplay.appendChild(textSpan);

					// 切换背景 & 粒子
					this.switchWeather(weatherType);

				} catch (err) {
					console.warn('天气获取失败，使用默认天气', err);
					// 回退到晴天
					this.currentWeather = 'sunny';
					this.switchWeather('sunny');
					this.cityDisplay.textContent = `📍 ${this.city}`;
					this.tempDisplay.textContent = '--°C';
					this.conditionDisplay.innerHTML = '';
					const emojiSpan = document.createElement('span');
					emojiSpan.className = 'emoji';
					emojiSpan.textContent = '☀️';
					const textSpan = document.createElement('span');
					textSpan.textContent = '晴 (离线)';
					this.conditionDisplay.appendChild(emojiSpan);
					this.conditionDisplay.appendChild(textSpan);
				}

				this.isLoading = false;
			}

            /* ── 切换城市 ── */
            switchCity() {
                const input = document.getElementById('cityInput');
                const val = input.value.trim();
                if (val && val !== this.city) {
                    this.city = val;
                    this.fetchWeather();
                }
            }

            /* ── 切换天气背景 ── */
            switchWeather(type) {
                const data = WEATHER_MAP[type] || WEATHER_MAP.sunny;

                // 1. 更新 body 背景
                document.body.style.background = data.bodyBg;

                // 2. 更新粒子
                const config = data.particle;
                const count = config.count || CONFIG.particleCount.default;

                // 清空并重新生成粒子
                this.particles = [];
                for (let i = 0; i < count; i++) {
                    this.particles.push(new Particle(this.width, this.height, config));
                }

                // 3. 特殊标记
                this.isRaining = (type === 'rainy' || type === 'thunder');
                this.lightningFlash = 0;
                this.lightningTimer = 0;

                // 4. 如果已有动画则继续，否则启动
                if (!this.animationId) {
                    this.animate();
                }
            }

            /* ── 动画循环 ── */
            animate() {
                const ctx = this.ctx;
                const w = this.width;
                const h = this.height;

                // 清空画布 (透明，背景由 CSS 展示)
                ctx.clearRect(0, 0, w, h);

                // 雷雨闪电
                if (this.currentWeather === 'thunder') {
                    this.lightningTimer++;
                    if (this.lightningTimer > rand(60, 200)) {
                        this.lightningFlash = 1.0;
                        this.lightningTimer = 0;
                    }
                    if (this.lightningFlash > 0) {
                        this.lightningFlash *= 0.92;
                        if (this.lightningFlash > 0.05) {
                            ctx.fillStyle = `rgba(255, 255, 255, ${this.lightningFlash * 0.25})`;
                            ctx.fillRect(0, 0, w, h);
                            // 第二道闪电更亮
                            if (Math.random() > 0.7) {
                                ctx.fillStyle = `rgba(255, 255, 255, ${this.lightningFlash * 0.15})`;
                                ctx.fillRect(0, 0, w, h);
                            }
                        } else {
                            this.lightningFlash = 0;
                        }
                    }
                }

                // 更新 & 绘制粒子
                const config = WEATHER_MAP[this.currentWeather]?.particle || WEATHER_MAP.sunny.particle;
                for (const p of this.particles) {
                    p.update(w, h);
                    // 如果粒子数量不足，补充
                    p.draw(ctx);
                }

                // 持续动画
                this.animationId = requestAnimationFrame(() => this.animate());
            }

            /* ── 停止动画 (用于清理) ── */
            stop() {
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                    this.animationId = null;
                }
            }
        }

        /* =============================================================
               5. 启动
               ============================================================= */
        document.addEventListener('DOMContentLoaded', () => {
            const app = new WeatherBackground();

            // 暴露到全局便于调试
            window.__weatherApp = app;

            // 页面卸载时停止动画
            window.addEventListener('beforeunload', () => app.stop());
        });
    </script>
